name: Build Mega Hack v9 Pro

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC C++20 Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Mega Hack v9 Pro & Generate HD Vector Logo
        shell: pwsh
        run: |
          # 1. Biên dịch trực tiếp src/main.cpp (Không cần thư viện ngoài)
          cl.exe /nologo /std:c++20 /O2 /EHsc /MD /LD src/main.cpp user32.lib gdi32.lib opengl32.lib winmm.lib psapi.lib /Fe:absolute.megahack_v9.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 2. Tạo bản nạp trực tiếp XInput9_1_0.dll cho GeometryDash.exe
          Copy-Item "absolute.megahack_v9.dll" "XInput9_1_0.dll"

          New-Item -ItemType Directory -Force -Path "pkg" | Out-Null
          Copy-Item "absolute.megahack_v9.dll" "pkg/absolute.megahack_v9.dll"

          # 3. Vẽ Logo Mega Hack v9 Vector HD 256x256
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
          $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
          $g.Clear([System.Drawing.Color]::Transparent)

          $bgRect = New-Object System.Drawing.Rectangle(10, 10, 236, 236)
          $bgBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
            $bgRect,
            [System.Drawing.Color]::FromArgb(255, 24, 14, 22),
            [System.Drawing.Color]::FromArgb(255, 10, 10, 15),
            45.0
          )
          $path = New-Object System.Drawing.Drawing2D.GraphicsPath
          $r = 46
          $path.AddArc(10, 10, $r, $r, 180, 90)
          $path.AddArc(246 - $r, 10, $r, $r, 270, 90)
          $path.AddArc(246 - $r, 246 - $r, $r, $r, 0, 90)
          $path.AddArc(10, 246 - $r, $r, $r, 90, 90)
          $path.CloseFigure()
          $g.FillPath($bgBrush, $path)

          $borderBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
            $bgRect,
            [System.Drawing.Color]::FromArgb(255, 255, 65, 75),
            [System.Drawing.Color]::FromArgb(255, 145, 15, 28),
            45.0
          )
          $borderPen = New-Object System.Drawing.Pen($borderBrush, 7)
          $g.DrawPath($borderPen, $path)

          $mPts = [System.Drawing.PointF[]]@(
            (New-Object System.Drawing.PointF(44, 192)),
            (New-Object System.Drawing.PointF(44, 62)),
            (New-Object System.Drawing.PointF(82, 62)),
            (New-Object System.Drawing.PointF(128, 126)),
            (New-Object System.Drawing.PointF(174, 62)),
            (New-Object System.Drawing.PointF(212, 62)),
            (New-Object System.Drawing.PointF(212, 192)),
            (New-Object System.Drawing.PointF(176, 192)),
            (New-Object System.Drawing.PointF(176, 118)),
            (New-Object System.Drawing.PointF(128, 182)),
            (New-Object System.Drawing.PointF(80, 118)),
            (New-Object System.Drawing.PointF(80, 192))
          )
          $mBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
            (New-Object System.Drawing.PointF(44, 55)),
            (New-Object System.Drawing.PointF(212, 195)),
            [System.Drawing.Color]::FromArgb(255, 255, 70, 75),
            [System.Drawing.Color]::FromArgb(255, 195, 18, 35)
          )
          $g.FillPolygon($mBrush, $mPts)
          $whitePen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(180, 255, 185, 185), 2.5)
          $g.DrawPolygon($whitePen, $mPts)

          $badgeRect = New-Object System.Drawing.Rectangle(146, 166, 78, 48)
          $badgeBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(245, 22, 22, 30))
          $g.FillRectangle($badgeBrush, $badgeRect)
          $badgePen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 255, 65, 75), 3)
          $g.DrawRectangle($badgePen, $badgeRect)
          $v9Font = New-Object System.Drawing.Font("Segoe UI", 24, [System.Drawing.FontStyle]::Bold)
          $whiteBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $g.DrawString("v9", $v9Font, $whiteBrush, 154, 165)

          $g.Dispose()
          $bmp.Save("$PWD/pkg/logo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

          # 4. Tự động lấy phiên bản Geode mới nhất
          $latestGeode = "5.0.0"
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/geode/releases/latest" -TimeoutSec 10
            if ($rel.tag_name) {
              $latestGeode = $rel.tag_name.TrimStart('v')
            }
          } catch {
            $latestGeode = "5.0.0"
          }

          $modJson = [ordered]@{
            geode = $latestGeode
            gd = @{
              win = "2.2081"
              android = "2.2081"
              mac = "2.2081"
              ios = "2.2081"
            }
            id = "absolute.megahack_v9"
            name = "Mega Hack v9 Pro"
            version = "v10.6.0"
            developer = "Absolute"
            description = "Mega Hack v9 Pro Engine for Geometry Dash 2.2081. Press TAB or INSERT in-game to open."
            tags = @("gameplay", "interface", "utility", "enhancement", "cheats")
            "early-load" = $true
          } | ConvertTo-Json -Depth 5

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$PWD/pkg/mod.json", $modJson, $utf8NoBom)
          [System.IO.File]::WriteAllText("$PWD/pkg/about.md", "# Mega Hack v9 Pro (v10.6.0)`nPress **TAB** or **INSERT** in-game to open the 6-column Mega Hack v9 menu.", $utf8NoBom)
          [System.IO.File]::WriteAllText("$PWD/pkg/changelog.md", "# v10.6.0`n- Added GLSL Shader unbinder, Texture Font Atlas, XInput9_1_0 auto-loader, and HD Vector Logo.", $utf8NoBom)

          Compress-Archive -Path "pkg/*" -DestinationPath "temp_pkg.zip" -Force
          Move-Item -Path "temp_pkg.zip" -Destination "absolute.megahack_v9.geode" -Force

      - name: Upload Mega Hack v9 Pro Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MegaHackV9_Pro_GD22081
          path: |
            absolute.megahack_v9.geode
            XInput9_1_0.dll
