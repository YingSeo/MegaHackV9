name: Build Mega Hack v9 Pro

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC C++20 Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Mega Hack v9 Pro DLL & Package .geode
        shell: pwsh
        run: |
          # 1. Biên dịch trực tiếp src/main.cpp bằng MSVC C++20 + OpenGL
          cl.exe /nologo /std:c++20 /O2 /EHsc /MD /LD src/main.cpp user32.lib gdi32.lib opengl32.lib winmm.lib psapi.lib /Fe:absolute.megahack_v9.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 2. Tạo bản nạp trực tiếp xinput1_4.dll (chép thẳng vào thư mục Geometry Dash)
          Copy-Item "absolute.megahack_v9.dll" "xinput1_4.dll"

          # 3. Tạo thư mục đóng gói chuẩn cấu trúc gốc .geode
          New-Item -ItemType Directory -Force -Path "pkg" | Out-Null
          Copy-Item "absolute.megahack_v9.dll" "pkg/absolute.megahack_v9.dll"

          $modJson = @{
            geode = "4.4.0"
            gd = @{
              win = "*"
              android = "*"
              mac = "*"
            }
            id = "absolute.megahack_v9"
            name = "Mega Hack v9 Pro"
            version = "v9.9.0"
            developer = "Absolute"
            description = "Mega Hack v9.9.0 Ultimate + QOLMod Engine for Geometry Dash 2.2081. Press TAB to toggle."
            tags = @("gameplay", "interface", "utility", "enhancement", "cheats")
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "pkg/mod.json" -Value $modJson -Encoding UTF8

          Set-Content -Path "pkg/about.md" -Value "# Mega Hack v9 Pro`nPress **TAB** in-game to toggle the 6-column Mega Hack v9 interface." -Encoding UTF8
          Set-Content -Path "pkg/changelog.md" -Value "# v9.9.0`n- Full OpenGL + Engine Hook release for Geometry Dash 2.2081." -Encoding UTF8

          # 4. Nén từ bên trong thư mục pkg để mod.json nằm đúng ở tầng gốc (Root)
          Compress-Archive -Path "pkg/*" -DestinationPath "absolute.megahack_v9.zip" -Force
          Move-Item -Path "absolute.megahack_v9.zip" -Destination "absolute.megahack_v9.geode" -Force

      - name: Upload Mega Hack v9 Pro Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MegaHackV9_Pro_GD22081
          path: |
            absolute.megahack_v9.geode
            xinput1_4.dll
